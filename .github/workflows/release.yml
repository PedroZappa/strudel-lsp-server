name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to validate (X.Y.Z); published versions require an immutable release ref'
        required: true
        type: string
      ref:
        description: 'Git ref to check out (defaults to the dispatch ref); use the immutable tag for published versions'
        required: false
        type: string
      operator:
        description: 'GitHub handle authorizing the validation'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify release identity and package parity
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
          RELEASE_OPERATOR: ${{ github.event_name == 'workflow_dispatch' && inputs.operator || github.actor }}
        run: npm run verify:release

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run full test suite
        run: npm test

      - name: Run parser integration suite
        run: npm run test:parser

      - name: Run semantic engine suite
        run: npm run test:semantic

      - name: Run language database suite
        run: npm run test:metadata

      - name: Run configuration suite
        run: npm run test:configuration

      - name: Run LSP layer suite
        run: npm run test:lsp

      - name: Run language feature suite
        run: npm run test:features

      - name: Run mini-notation suite
        run: npm run test:mini

      - name: Run protocol robustness suite
        run: npm run test:protocol

      - name: Run bounded soak/lifecycle suite
        run: npm run test:soak

      - name: Validate real Strudel documentation corpus
        run: npm run validate:corpus

      - name: Build package
        run: npm run build

      - name: Check package contents
        run: npm run verify:contents

      - name: Verify offline installation and stdio launch
        run: npm run verify:package

      - name: Verify clean consumer installation without inherited npm configuration
        run: npm run verify:consumer

      # Performance regressions remain advisory under ADR-074; correctness gates block release.
      - name: Run advisory benchmark regression check
        continue-on-error: true
        run: npm run benchmark:check

      - name: Run advisory installed-binary JSON-RPC benchmark
        continue-on-error: true
        run: npm run benchmark:e2e

      - name: Audit runtime dependencies
        run: npm audit --omit=dev

      - name: Audit all dependencies
        continue-on-error: true
        run: npm audit

      - name: Audit prototype client dependencies
        run: npm audit --prefix client

  publish:
    name: Publish with OIDC provenance
    # ADR-049: first publication is operator-managed; trusted publishing starts after 0.1.0.
    needs: validate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name != 'v0.1.0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm-release
      url: https://www.npmjs.com/package/strudel-lsp-server
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out immutable tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The verifier selects pack/publish dry-run parity before publication and
      # registry artifact parity after publication; npm rejects publish dry-runs
      # for versions that already exist.
      - name: Reverify immutable release commit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_OPERATOR: ${{ github.actor }}
        run: npm run verify:release

      - name: Publish with trusted publishing
        run: npm publish --access public

      - name: Wait for published version to become visible
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          package_name="strudel-lsp-server"
          for ((attempt = 1; attempt <= 12; attempt++)); do
            if npm view "${package_name}@${version}" version --prefer-online >/dev/null 2>&1; then
              echo "${package_name}@${version} visible (attempt ${attempt})"
              exit 0
            fi
            echo "not visible yet (attempt ${attempt}/12); retrying in 15s"
            sleep 15
          done
          echo "${package_name}@${version} never became visible" >&2
          exit 1

      - name: Verify published signatures and attestations
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          check_dir="$(mktemp -d)"
          npm install --prefix "$check_dir" --ignore-scripts --prefer-online "strudel-lsp-server@${version}"
          npm audit signatures --prefix "$check_dir"
